<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f1"><title>Whack-a-Justin · McJustin Edition</title>
<style>
:root{color-scheme:light;--wine:#78243c;--pink:#bf4a73;--cream:#fff8f1;--gold:#f5c05a;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 0,#fff 10%,#fff8f1 70%);color:var(--wine);display:grid;place-items:center;min-height:100svh}.app{width:min(100%,540px);padding:14px 14px 26px;text-align:center}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.23em;opacity:.55;margin:0 0 6px}.title{font-size:clamp(37px,9vw,55px);font-weight:1000;line-height:1.02;letter-spacing:-.07em;margin:0}.sub{font-weight:900;font-size:21px;margin:5px 0 15px}.sub em{color:var(--pink);font-style:normal}.stats{display:flex;gap:10px;margin-bottom:14px}.stat{background:#fff;border:2px solid #e8d8d4;border-radius:16px;flex:1;box-shadow:0 4px 0 #ebdeda;overflow:hidden}.stat small{background:var(--wine);display:block;color:white;padding:5px;letter-spacing:.14em;font-size:10px;font-weight:900}.stat strong{display:block;font-size:30px;padding:5px;font-variant-numeric:tabular-nums}.tray{position:relative;background:linear-gradient(135deg,#ddd7d5,#beb5b5);border:5px solid #eee5e3;border-radius:27px;box-shadow:0 10px 0 #a79d9d,0 18px 25px #4d27331c;padding:16px 10px 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 6px}.hole{position:relative;aspect-ratio:1/1.17;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}.shadow{position:absolute;left:5%;right:5%;bottom:7%;height:33%;background:#62575a;border-radius:50%;box-shadow:inset 0 5px 10px #27181b88}.justin{position:absolute;z-index:2;left:3%;width:94%;height:93%;bottom:24%;object-fit:contain;object-position:center bottom;transform:translateY(58%) scale(.78);opacity:0;pointer-events:none;transition:transform .17s cubic-bezier(.2,1.45,.4,1),opacity .08s;filter:drop-shadow(0 3px 2px #321a2140)}.hole.up .justin{opacity:1;transform:translateY(0) scale(1)}.cup{position:absolute;z-index:3;width:91%;height:66%;left:4.5%;bottom:0;pointer-events:none;filter:drop-shadow(0 3px 2px #47323840)}.cup text{fill:var(--wine);font-size:15px;letter-spacing:-.8px;font-weight:1000}.hit{position:absolute;z-index:5;top:0;left:35%;font-size:27px;font-weight:1000;color:#ffce5f;text-shadow:2px 2px var(--wine);pointer-events:none;animation:float .45s ease-out forwards}@keyframes float{to{transform:translateY(-32px) scale(1.3);opacity:0}}.overlay{position:absolute;z-index:8;inset:0;border-radius:22px;background:#fff9f1ed;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.overlay[hidden]{display:none}.overlay h2{font-size:30px;line-height:1.1;letter-spacing:-.05em;margin:0 0 10px}.overlay p{line-height:1.5;max-width:280px;margin:0 0 19px}.btn{background:var(--wine);color:#fff;border:0;box-shadow:0 5px 0 #4f1229;border-radius:15px;min-height:49px;padding:12px 17px;font-weight:900;font-size:16px;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4f1229}.btn.primary{background:var(--gold);color:var(--wine);box-shadow:0 5px 0 #c38d39}.overlay .btn{width:min(100%,230px)}.controls{display:flex;gap:10px;margin-top:21px}.controls .primary{flex:1}.controls .small{min-width:55px}.hint{font-size:12px;opacity:.7;margin:17px 0 0}.footer{font-size:10px;opacity:.45;margin-top:12px}@media(max-width:390px){.app{padding:8px 9px 15px}.title{font-size:38px}.tray{padding:10px 6px 14px}.grid{gap:5px}.sub{margin-bottom:9px}.stats{margin-bottom:10px}.stat strong{font-size:26px}.controls{margin-top:17px}}@media(prefers-reduced-motion:reduce){.justin{transition:none}.hit{animation:none}}
</style></head>
<body><main class="app"><p class="eyebrow">THE VERY UNOFFICIAL ARCADE GAME</p><h1 class="title">Whack-a-Justin</h1><p class="sub">the <em>McJustin</em> edition</p><section class="stats" aria-label="Game statistics"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat"><small>TIME</small><strong id="time">30</strong></div></section><section class="tray" aria-label="Nine McJustin cups"><div id="grid" class="grid"></div><div id="overlay" class="overlay"><h2 id="overlayTitle">Ready to whack?</h2><p id="overlayText">Justin is hiding in the McJustin cups. Tap his cow-hoodie head whenever he pops up!</p><button id="overlayButton" class="btn primary">LET'S GO</button></div></section><section class="controls"><button class="btn small" id="sound" aria-label="Mute or unmute sounds">♪</button><button class="btn primary" id="start">START GAME</button><button class="btn small" id="pause" aria-label="Pause or resume">Ⅱ</button></section><p class="hint">30 seconds · One Justin · Zero mercy</p><footer class="footer">Fan-made parody. Not affiliated with McDonald's.</footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id),grid=$("grid");
const cup='<svg class="cup" viewBox="0 0 120 120" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14 Q4 3 19 7 Q37 13 52 7 Q69 1 84 8 Q103 13 116 5 L103 111 Q60 122 17 111 Z" fill="#fffaf2" stroke="#e9dad3" stroke-width="2"/><path d="M12 84 Q62 107 109 71 L105 92 Q60 121 15 103 Z" fill="#ad3561"/><text x="60" y="55" text-anchor="middle">McJustin</text><path d="M44 77 Q45 56 59 77 Q60 56 75 77" fill="none" stroke="#78243c" stroke-width="4" stroke-linecap="round"/></svg>';
for(let i=0;i<9;i++){const b=document.createElement("button");b.type="button";b.className="hole";b.setAttribute("aria-label","McJustin cup "+(i+1));b.innerHTML='<div class="shadow"></div><img class="justin" src="assets/justin.svg" alt="">'+cup;b.addEventListener("pointerdown",()=>whack(i));grid.append(b)}
const holes=[...grid.children];let active=-1,last=-1,score=0,time=30,best=0,running=false,paused=false,soundOn=true,tick=null,next=null,hide=null,audio=null;
try{best=Number(localStorage.getItem("mcjustin-best")||0)}catch(e){}$("best").textContent=best;
function beep(f){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.3,audio.currentTime+.07);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}
function clearHead(){holes.forEach(h=>h.classList.remove("up"));active=-1;clearTimeout(hide)}
function spawn(){if(!running||paused)return;clearHead();let i;do{i=Math.floor(Math.random()*9)}while(i===last);last=i;active=i;holes[i].classList.add("up");hide=setTimeout(()=>{if(active===i)clearHead()},Math.max(460,1050-score*12));next=setTimeout(spawn,Math.max(460,850-score*8))}
function whack(i){if(!running||paused||active!==i)return;score++;$("score").textContent=score;beep(360+Math.min(45,score)*16);const fx=document.createElement("span");fx.className="hit";fx.textContent="+1";holes[i].append(fx);setTimeout(()=>fx.remove(),460);clearHead();if(score>best){best=score;$("best").textContent=best;try{localStorage.setItem("mcjustin-best",String(best))}catch(e){}}}
function stopTimers(){clearInterval(tick);clearTimeout(next);clearTimeout(hide)}
function show(title,text,button){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayButton").textContent=button;$("overlay").hidden=false}
function end(){running=false;paused=false;stopTimers();clearHead();$("pause").textContent="Ⅱ";$("start").textContent="PLAY AGAIN";show("Time's up!","You whacked Justin "+score+" time"+(score===1?"":"s")+"! Best score: "+best+".","PLAY AGAIN")}
function start(){stopTimers();clearHead();score=0;time=30;last=-1;running=true;paused=false;$("score").textContent=0;$("time").textContent=30;$("pause").textContent="Ⅱ";$("start").textContent="RESTART";$("overlay").hidden=true;tick=setInterval(()=>{if(paused)return;time--;$("time").textContent=time;if(time<=0)end()},1000);next=setTimeout(spawn,360)}
function togglePause(){if(!running)return;paused=!paused;if(paused){clearHead();clearTimeout(next);$("pause").textContent="▶";show("Paused","Justin is taking a snack break.","RESUME")}else{$("pause").textContent="Ⅱ";$("overlay").hidden=true;next=setTimeout(spawn,250)}}
$("overlayButton").addEventListener("click",()=>paused?togglePause():start());$("start").addEventListener("click",start);$("pause").addEventListener("click",togglePause);$("sound").addEventListener("click",()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"♪":"×";$("sound").setAttribute("aria-label",soundOn?"Mute sounds":"Unmute sounds")});document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused)togglePause()});
</script></body></html>
