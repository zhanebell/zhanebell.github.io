:root{--bg:#111214;--ink:#f6efe1;--tile:#303136;--line:#414248;--green:#527f51;--gold:#d8a526;--miss:#55565c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f4d88d;outline-offset:2px}.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center}.bar{height:64px;width:100%;border-bottom:1px solid #33343a;display:flex;justify-content:center;align-items:center;position:relative}.brand{font:700 34px Georgia,serif;letter-spacing:-2px}.actions{position:absolute;right:9px;display:flex}.actions button{background:none;border:0;font-size:22px;width:40px;height:40px}.main{width:100%;max-width:490px;flex:1;display:flex;flex-direction:column;align-items:center;padding:17px 9px 12px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9e9c97}.date{font-size:11px;color:#a5a19a;margin-top:6px}.board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(320px,90vw,42dvh);aspect-ratio:5/6;margin:19px auto 15px}.guessrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:clamp(19px,6vw,29px);font-weight:800;background:#18191c}.tile.filled{border-color:#898a8c}.tile.correct,.key.correct{background:var(--green);border-color:var(--green);color:#fff}.tile.present,.key.present{background:var(--gold);border-color:var(--gold);color:#141414}.tile.absent,.key.absent{background:var(--miss);border-color:var(--miss);color:#fff}.keyboard{width:100%;max-width:470px;margin-top:auto;display:flex;flex-direction:column;gap:7px}.keys{display:flex;justify-content:center;gap:4px}.key{height:51px;flex:1;min-width:0;border:0;border-radius:5px;background:#34353a;font-size:14px;font-weight:800;touch-action:manipulation}.key.wide{flex:1.5;font-size:11px;background:#ece2ce;color:#1717 </style></head><body><div class="app"><header class="bar"><div class="brand">justinle</div><div class="actions"><button id="statsBtn" aria-label="Statistics">▥</button><button id="helpBtn" aria-label="Help">?</button><button id="settingsBtn" aria-label="Settings">⚙</button></div></header><main class="main"><div class="eyebrow">a daily word game with a problem</div><div class="date" id="date"></div><div class="board" id="board" role="grid" aria-label="Word puzzle"></div><div class="keyboard" id="keyboard"></div><div class="footer"><span>streak: <b id="streak">0</b></span><span>justin interruptions: <b id="interruptions">0</b></span></div></main></div><div id="toast" class="toast hidden" role="status"></div><div id="nudge" class="nudge hidden"></div><div id="shade" class="shade hidden"><div id="modal" class="modal" role="dialog" aria-modal="true"><img id="portrait" class="portrait hidden" src="justin.svg" alt="Justin smiling in a black shirt"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="primary" id="modalOk">OK</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), words='beach shore ocean coral pearl drift dunes sandy shell waves crest water inlet river brook creek reeds marsh glade grove bloom petal tulip daisy lilac lotus maple birch cedar olive mango guava lemon peach berry grape apple melon honey sugar cocoa latte toast bread cream spice basil thyme grain wheat pasta pizza sushi ramen salad onion chili cumin clove aroma fresh crisp sweet savor feast diner table plate glass spoon linen woven fiber cloth satin suede denim craft color blush ivory amber ochre terra umber beige taupe mauve slate stone pebble flint chalk steel brass bronze jewel charm shine gleam light sunny solar prism spark flare flame lunar night early cloud misty foggy rainy storm windy clear skies stars astro orbit earth world globe north south polar tropic humid balmy frost green quiet still peace relax gentle silky plush cabin porch patio foyer house haven space plain clean order shape curve angle round lines point trace drawn sketch paint brush paper diary notes pages books novel story prose verse rhyme music sound tones chord piano dance tempo beats glide float sails boats ferry yacht anchor knots sweep trail route roads lanes alley track steps climb ridge slope valley mount vista scene sight looks frame focus image pause daily today dates timer clock hours years weeks month sleep dream hopes trust brave daring happy smile laugh cheer grace bliss heart adore close share token bonds unite match equal truth start begin first final ready steady eager alert sharp smart quick rapid swift agile going grows sprout seeds roots trunk plant garden birds robin crane heron finch shark whale otter horse zebra tiger foxes bears panda koala mouse owlet hawks eagle wings flock count tally marks signs codes pixel bytes logic solve guess think brain learn teach study class skill goals plans build maker works tools handy drink juice tonic punch zesty tangy umami nerve civil radar vital'.split(' ').filter(w=>w.length===5);
const extras='about above abuse actor acute adapt admit adopt adult after again agent agree ahead alarm album alert alike alive allow alone along alter among angel anger angle angry apart apply arena argue arise array aside asset audio avoid award aware badly baker basic basis batch began begin begun being below bench birth black blame blank blast blend bless blind block blood board boast bonus boost bound brain brand brave break breed brick brief bring broad broke brown brush built buyer cable carry catch cause chain chair chaos chase cheap check cheek chest chief child chose claim close coach could court cover crash crazy crime cross crowd crown crude crush cycle dance dated deals death debut delay depth dirty doubt dozen draft drama drawn dress dried drive drove dying eight elite empty enemy enjoy enter entry error essay event every exact exist extra faith false fancy fault favor fence fever field fifth fifty fight fixed flash fleet flesh flood floor flour fluid focus force forth forty found frame frank fraud front fruit fully funny giant given glass glory glove going grade grand grant grass grave great greet grief gross group grown guard guest guide guilt habit harsh heavy hence hotel human humor ideal image imply index inner input issue joint judge known label large laser later laugh layer learn lease least leave legal level limit local loose lower loyal lucky lunch magic major maker march match maybe mayor medal media mercy merge merit metal might minor minus mixed model money month moral motor mouth movie naval never newly noise novel nurse occur offer often onset opera orbit order other ought outer owner panel panic party paste patch peace phase phone photo piece pilot pitch place plain plane plant plate plead point pound power press price pride prime print prior prize proof proud prove pulse punch queen quick quiet quite quote radio raise range rapid ratio reach react ready realm refer relax reply reset resin retro rhyme rider ridge right rival river roast const dictionary=new Set([...words,...extras,'artsy']);let fullDictionaryReady=false;const dictionaryPromise=fetch('https://raw.githubusercontent.com/tabatkins/wordle-list/main/words',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('dictionary unavailable');return r.text()}).then(t=>{for(const w of t.toLowerCase().split(/\s+/))if(/^[a-z]{5}$/.test(w))dictionary.add(w);fullDictionaryReady=true}).catch(()=>{});async function validWord(w){w=w.toLowerCase();if(dictionary.has(w))return true;await dictionaryPromise;if(dictionary.has(w))return true;try{const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),{signal:AbortSignal.timeout(3500)});if(response.ok){dictionary.add(w);return true}if(response.status===404)return false}catch(e){}return !fullDictionaryReady;}const answers=words.filter(w=>!['today','dates','weeks','month','going','looks','works','notes','pages','birds','foxes','bears','knots','boats','roads','lanes','steps','hours','years','lines','tones','beats','seeds','roots','tools','codes','bytes','goals','plans','signs','marks','stars','skies'].includes(w));
const dateKey=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Honolulu',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dayNumber=s=>Math.floor((Date.parse(s+'T00:00:00Z')-Date.UTC(2026,0,1))/86400000);
const today=dateKey(), day=dayNumber(today), answer=answers[((day*7919+127)%answers.length+answers.length)%answers.length].toUpperCase(), storageKey='justinle-'+today;
let state={guesses:[],current:'',status:'playing',interruptions:0},settings={chaos:true,volume:false},stats={played:0,wins:0,streak:0,last:''},modalCallback=null,locked=false,interruptCooldown=0,typing=0,toastTimer,sideTimer,context=null;
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
state={...state,...load(storageKey,{})};stats={...stats,...load('justinle-stats',{})};settings={...settings,...load('justinle-settings',{})};
if(!Array.isArray(state.guesses)||state.guesses.length>6)state={guesses:[],current:'',status:'playing',interruptions:0};$('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'Pacific/Honolulu',month:'long',day:'numeric',year:'numeric'}).format(new Date());$('streak').textContent=stats.streak;
const board=$('board'),keyboard=$('keyboard');for(let r=0;r<6;r++){const row=document.createElement('div');row.className='guessrow';row.setAttribute('role','row');for(let c=0;c<5;c++){const tile=document.createElement('div');tile.className='tile';tile.setAttribute('role','gridcell');row.append(tile)}board.append(row)}
const keyButtons={};for(const row of ['QWERTYUIOP','ASDFGHJKL','↤ZXCVBNM↵']){const wrap=document.createElement('div');wrap.className='keys';for(const char of row){const b=document.createElement('button');b.className='key'+('↤↵'.includes(char)?' wide':'');b.textContent=char==='↤'?'⌫':char==='↵'?'ENTER':char;b.setAttribute('aria-label',char==='↤'?'Backspace':char==='↵'?'Enter':char);b.addEventListener('click',()=>input(char));wrap.append(b);keyButtons[char]=b}keyboard.append(wrap)}
function evaluate(guess){const result=Array(5).fill('absent'),counts={};for(let i=0;i<5;i++){if(guess[i]===answer[i])result[i]='correct';else counts[answer[i]]=(counts[answer[i]]||0)+1}for(let i=0;i<5;i++)if(result[i]!=='correct'&&counts[guess[i]]>0){result[i]='present';counts[guess[i]]--}return result}
function render(){const keys={};[...board.children].forEach((row,r)=>{const guess=state.guesses[r]|| (r===state.guesses.length?state.current:'');const marks=r<state.guesses.length?evaluate(guess):[];[...row.children].forEach((tile,c)=>{tile.textContent=guess[c]||'';tile.className='tile'+(guess[c]?' filled':'')+(marks[c]?' '+marks[c]:'');if(marks[c]){const k=guess[c],rank={absent:1,present:2,correct:3};if(!keys[k]||rank[marks[c]]>rank[keys[k]])keys[k]=marks[c]}})});Object.entries(keyButtons).forEach(([k,b])=>{b.className='key'+('↤↵'.includes(k)?' wide':'')+(keys[k]?' '+keys[k]:'')});$('interruptions').textContent=state.interruptions;$('streak').textContent=stats.streak;save(storageKey,state)}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1700)}
function modal(title,body,justin=false,button='OK',callback=null){locked=true;modalCallback=callback;$('modalTitle').textContent=title;$('modalBody').innerHTML='';if(typeof body==='string'){const p=document.createElement('p');p.textContent=body;$('modalBody').append(p)}else $('modalBody').append(body);$('portrait').classList.toggle('hidden',!justin);$('modal').classList.toggle('justinmodal',justin);$('modalOk').textContent=button;$('shade').classList.remove('hidden');$('modalOk').focus()}
function closeModal(){if($('shade').classList.contains('hidden'))return;$('shade').classList.add('hidden');locked=false;const cb=modalCallback;modalCallback=null;if(cb)cb()}
$('modalOk').addEventListener('click',closeModal);
const remarks=["bro. i was literally about to guess that.","the vibes of that word are deeply concerning.","i asked my imaginary lawyer. he said no.","your keyboard has been reported to management.","hold on. i need to consult the council of justins.","justin.exe has stopped respecting your time.","that guess has been sent to the department of questionable decisions.","i have a very important announcement: never mind.","i checked the dictionary. then i got distracted.","you are one letter away from impressing absolutely nobody.","the board called. it wants better guesses.","i would help, but that sounds like a you problem.","breaking news: justin has interrupted you again.","i am giving you a hint: it contains letters.","my professional opinion? try being correct.","please hold while i pretend to think.","did you get permission to use that vowel?","i have decided that this is now a justin appreciation break.","congratulations on finding the enter key.","this game would be easier if you simply knew the answer.","the next interruption will be even less useful.","quick survey: on a scale of one to justin, how annoyed are you?","i just wanted to remind you that i exist.","i am not saying your guess is bad. i am heavily implying it.","your free trial of uninterrupted thinking has expired.","i have taken the liberty of wasting three seconds.","justin quality control has flagged your confidence.","what if instead of guessing you complimented me?","sorry. i accidentally pressed the interrupt button again.","this is an official notification that nothing happened."];
function interrupt(custom){if(!settings.chaos||locked||state.status!=='playing')return;state.interruptions++;render();const line=custom||remarks[Math.floor(Math.random()*remarks.length)];modal('justin interruption',line,true,['OK BRO','SURE JUSTIN','LET ME PLAY','THANKS I GUESS','PLEASE LEAVE','COOL STORY'][Math.floor(Math.random()*6)]);interruptCooldown=Date.now()+2200}
function nudge(){if(!settings.chaos||locked||state.status!=='playing')return;const lines=['justin is watching.','nice keyboard you got there.','that letter looks suspicious.','justin has no useful advice.','typing detected. judgment initiated.','your vowels have been audited.','justin is judging this silently.','please wait. justin is doing nothing.','your confidence is under review.'];$('nudge').innerHTML='<img src="justin.svg" alt="">'+lines[Math.floor(Math.random()*lines.length)];$('nudge').classList.remove('hidden');clearTimeout(sideTimer);sideTimer=setTimeout(()=>$('nudge').classList.add('hidden'),1600)}
function input(char){if(locked||state.status!=='playing')return;if(char==='↤'){state.current=state.current.slice(0,-1)}else if(char==='↵'){submit();return}else if(/^[A-Z]$/.test(char)&&state.current.length<5){state.current+=char;typing++;if(settings.chaos&&typing%8===0&&Math.random()<.65)nudge()}render();if(settings.chaos&&typing>4&&Date.now()>interruptCooldown&&Math.random()<.075)interrupt()}
async function submit(){if(state.current.length!==5){toast('not enough letters');return}if(locked)return;locked=true;const pending=state.current;const valid=await validWord(pending);locked=false;if(state.current!==pending||state.status!=='playing')return;if(!valid){toast('Justin didn’t like that word');return}const guess=state.current;state.guesses.push(guess);state.current='';if(guess===answer){state.status='won'}else if(state.guesses.length===6){state.status='lost'}render();if(state.status!=='playing'){finish();return}if(settings.chaos){if(state.guesses.length===3){modal('YOU WON!','just kidding. i just wanted to see your face.',true,'THAT WAS RUDE',()=>interrupt('okay, NOW you can keep guessing.'))}else if(Math.random()<.78)interrupt();else nudge()}}
function finish(){if(!stats.last||stats.last!==today){stats.played++;if(state.status==='won'){stats.wins++;stats.streak=stats.last&&dayNumber(today)-dayNumber(stats.last)===1?stats.streak+1:1}else stats.streak=0;stats.last=today;save('justinle-stats',stats)}render();const win=state.status==='won';modal(win?'fine. you win.':'justin wins.',win?'you solved it in '+state.guesses.length+' guesses. justin is deeply unimpressed.':'the word was '+answer+'. justin would like to thank himself.',true,'SEE RESULTS',showStats)}
function showStats(){const wrap=document.createElement('div');wrap.className='statgrid';for(const [n,v] of [['played',stats.played],['wins',stats.wins],['streak',stats.streak],['interruptions',state.interruptions]]){const d=document.createElement('div');d.innerHTML='<strong>'+v+'</strong><small>'+n+'</small>';wrap.append(d)}const holder=document.createElement('div');holder.append(wrap);const p=document.createElement('p');p.textContent=state.status==='playing'?'come back after finishing the puzzle.':state.status==='won'?'justin reluctantly approves.':'better luck tomorrow.';holder.append(p);modal('your stats',holder,false,'CLOSE')}
function showHelp(){const div=document.createElement('div');div.className='help';div.innerHTML='<p>Guess the five-letter word in six tries. Green means correct position, yellow means elsewhere, gray means absent.</p><div class="example"><span class="correct">J</span><span>U</span><span>S</span><span>T</span><span>I</span></div><p>Justin interrupts you for absolutely no reason. He never changes the actual clues.</p><p>One puzzle per day, resetting at midnight Hawaii time.</p>';modal('how to play',div,false,'GOT IT')}
function showSettings(){const div=document.createElement('div');const p=document.createElement('p');p.textContent='Justin interference';const b=document.createElement('button');b.className='primary';b.textContent=settings.chaos?'ON (recommended)':'OFF';b.onclick=()=>{settings.chaos=!settings.chaos;save('justinle-settings',settings);b.textContent=settings.chaos?'ON (recommended)':'OFF'};div.append(p,b);modal('settings',div,false,'DONE')}
$('statsBtn').onclick=showStats;$('helpBtn').onclick=showHelp;$('settingsBtn').onclick=showSettings;
document.addEventListener('keydown',e=>{if(!$('shade').classList.contains('hidden')){if(e.key==='Escape'||e.key==='Enter')closeModal();return}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(k==='Enter')input('↵');else if(k==='Backspace')input('↤');else if(/^[a-z]$/i.test(k))input(k.toUpperCase())});
render();if(state.status!=='playing')setTimeout(()=>modal('today is done',state.status==='won'?'you already defeated justin today.':'justin already defeated you today.',true,'STATS',showStats),450);else if(!load('justinle-seen-help',false)){save('justinle-seen-help',true);setTimeout(showHelp,350)}
})();
